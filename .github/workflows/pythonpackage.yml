name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    # The runner's tool cache no longer has these Python versions, so use
    # the official images; the Docker image of Pinry runs Python 3.9.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.7", "3.8", "3.9"]

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Lint with flake8
      run: |
        flake8
    - name: Django test
      run: |
        python manage.py test
